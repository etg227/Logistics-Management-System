{% extends "base.html" %}

{% block title %}Error {{ code }} | CargoFlow{% endblock %}

{% block content %}

<div class="error-page">
    <div class="error-code">{{ code }}</div>

    <h1>Unable to complete your request</h1>

    <p class="muted">{{ message }}</p>

    <a class="btn btn-primary"
       href="{{ url_for('main.index') }}">
        Return Home
    </a>
</div>

{% endblock %}
