{% extends "base.html" %}

{% block title %}{{ title }} | CargoFlow{% endblock %}

{% block content %}

<div class="card">
    <span class="status-tag">Access Granted</span>

    <h1>{{ title }}</h1>

    <p class="muted">
        Your {{ role }} account has permission to access this page.
    </p>

    <p>
        Role-based access control is working correctly.
    </p>

    <a class="btn btn-primary"
       href="{{ url_for('main.dashboard') }}">
        Return to Dashboard
    </a>
</div>

{% endblock %}
